{% extends 'base.html' %}{% block title %}Publish project{% endblock %}{% block content %}<section class="form-wrap"><p class="eyebrow">NEW PROJECT</p><h1>Describe the challenge.</h1><form method="post"><label>Title<input name="title" required></label><label>Description<textarea name="description" required></textarea></label><label>Required skills <small>Comma separated</small><input name="required_skills" placeholder="Python, SQL, machine learning"></label><label>Preferred fields <small>Comma separated</small><input name="preferred_fields" placeholder="Computer Science, Economics"></label><label>Duration<input name="project_duration" placeholder="8 weeks"></label><label>Location type<select name="location_type"><option>Remote</option><option>Hybrid</option><option>On-site</option></select></label><label>Compensation<select name="compensation_type"><option>Unpaid / learning</option><option>Paid internship</option><option>Stipend</option></select></label><label>Expected deliverables<textarea name="expected_deliverables"></textarea></label><button class="button">Publish project</button></form></section>{% endblock %}
