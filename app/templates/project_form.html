{% extends 'base.html' %}{% block title %}Project{% endblock %}{% block content %}<section class="form-wrap"><p class="eyebrow">{% if project %}EDIT PROJECT{% else %}NEW PROJECT{% endif %}</p><h1>Describe the challenge.</h1><form method="post" action="{% if project %}/startup/projects/{{ project.id }}/edit{% else %}/startup/projects/new{% endif %}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Title<input name="title" required value="{{ project.title if project else '' }}"></label><label>Description<textarea name="description" required>{{ project.description if project else '' }}</textarea></label><label>Required skills <small>Comma separated</small><input name="required_skills" value="{{ project.required_skills|join(', ') if project else '' }}" placeholder="Python, SQL, machine learning"></label><label>Preferred fields <small>Comma separated</small><input name="preferred_fields" value="{{ project.preferred_fields|join(', ') if project else '' }}" placeholder="Computer Science, Economics"></label><label>Duration<input name="project_duration" value="{{ project.project_duration if project else '' }}" placeholder="8 weeks"></label><label>Location type<select name="location_type"><option {% if project and project.location_type == 'Remote' %}selected{% endif %}>Remote</option><option {% if project and project.location_type == 'Hybrid' %}selected{% endif %}>Hybrid</option><option {% if project and project.location_type == 'On-site' %}selected{% endif %}>On-site</option></select></label><label>Compensation<select name="compensation_type"><option>Unpaid / learning</option><option>Paid internship</option><option>Stipend</option></select></label><label>Expected deliverables<textarea name="expected_deliverables">{{ project.expected_deliverables if project else '' }}</textarea></label><button class="button">{% if project %}Save changes{% else %}Publish project{% endif %}</button></form></section>{% endblock %}
