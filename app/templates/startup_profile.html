{% extends 'base.html' %}{% block title %}Company profile{% endblock %}{% block content %}<section class="form-wrap"><p class="eyebrow">COMPANY PROFILE</p><h1>Help students understand your work.</h1><form method="post"><label>Company name<input name="company_name" required value="{{ profile.company_name if profile else '' }}"></label><label>Contact name<input name="contact_name" value="{{ profile.contact_name if profile else '' }}"></label><label>Description<textarea name="description">{{ profile.description if profile else '' }}</textarea></label><label>Website<input name="website" value="{{ profile.website if profile else '' }}"></label><label>Location<input name="location" value="{{ profile.location if profile else '' }}"></label><label>Industry<input name="industry" placeholder="AI, fintech, cybersecurity" value="{{ profile.industry if profile else '' }}"></label><label>Innovation zone<select name="innovation_zone"><option value="">Select category</option><option {% if profile and profile.innovation_zone == 'TEDA Tirana' %}selected{% endif %}>TEDA Tirana</option><option>Other Albanian innovation zone</option><option>Elsewhere in Albania</option></select></label><button class="button">Save company</button></form></section>{% endblock %}
