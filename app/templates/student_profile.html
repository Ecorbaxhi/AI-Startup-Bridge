{% extends 'base.html' %}{% block title %}Student profile{% endblock %}{% block content %}<section class="form-wrap"><p class="eyebrow">YOUR PROFILE</p><h1>Make your strengths findable.</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Full name<input name="full_name" required value="{{ profile.full_name if profile else '' }}"></label><label>University<select name="university_id"><option value="">Select one</option>{% for university in universities %}<option value="{{ university.id }}" {% if profile and profile.university_id == university.id %}selected{% endif %}>{{ university.name }}</option>{% endfor %}</select></label><label>Field of study<input name="field_of_study" value="{{ profile.field_of_study if profile else '' }}"></label><label>Academic year<input name="academic_year" value="{{ profile.academic_year if profile else '' }}"></label><label>Skills <small>Comma separated</small><input name="skills" value="{{ profile.skills|join(', ') if profile else '' }}"></label><label>Interests <small>Comma separated</small><input name="interests" value="{{ profile.interests|join(', ') if profile else '' }}"></label><label>Availability<input name="availability" placeholder="Part-time, summer, evenings" value="{{ profile.availability if profile else '' }}"></label><label>Bio<textarea name="bio">{{ profile.bio if profile else '' }}</textarea></label><label><input type="checkbox" name="discovery_enabled" {% if not profile or profile.discovery_enabled %}checked{% endif %}> Allow startups to discover my profile</label><button class="button">Save profile</button></form></section>{% endblock %}
